<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kanakku</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<script src="https://cdn.jsdelivr.net/npm/chart.js">
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}
</script>
<style>
:root{
  --bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#64748b;
  --line:#e2e8f0;--primary:#2563eb;--green:#16a34a;--red:#dc2626;
  --orange:#ea580c;--bluebg:#eff6ff;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;color:var(--text);padding-bottom:calc(70px + env(safe-area-inset-bottom))}
header{position:sticky;top:0;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px;display:flex;justify-content:space-between;align-items:center;z-index:10}
h1{margin:0;font-size:20px;font-weight:700}
select,input,button{font:inherit}
input,select{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:white}
button{border:0;border-radius:10px;height:44px;padding:0 16px;font-weight:600;cursor:pointer}
.primary{background:var(--primary);color:white}
.danger{background:white;color:var(--red);border:1px solid #fecaca;height:36px;padding:0 10px;font-size:12px}

.cards-scroll{display:flex;gap:10px;overflow-x:auto;padding:16px;scroll-snap-type:x mandatory}
.card{flex:0 0 140px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;scroll-snap-align:start}
.card .label{font-size:11px;color:var(--muted);margin-bottom:4px}
.card .value{font-size:16px;font-weight:700}
.blue{color:var(--primary)}.red{color:var(--red)}.green{color:var(--green)}.orange{color:var(--orange)}

.content{padding:0 16px}
.tab-content{display:none}
.tab-content.active{display:block}

.panel{background:white;border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.panel h2{font-size:16px;margin:0 0 10px}
label{display:block;font-size:12px;color:var(--muted);font-weight:600;margin:10px 0 4px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.type{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type button{background:#f1f5f9;color:#475569}
.type .active{background:var(--primary);color:#fff}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.quick button{height:32px;padding:0 10px;background:#f1f5f9;color:#334155;font-size:12px}

.budget-row{margin:12px 0}
.budget-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.bar{height:8px;background:#e2e8f0;border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--primary)}
.fill.over{background:var(--red)}

.tx-item{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #f1f5f9}
.tx-item:last-child{border:0}
.tx-info .tx-cat{font-weight:600;font-size:14px}
.tx-info .tx-sub{font-size:12px;color:var(--muted)}
.tx-amt{text-align:right;font-weight:700}
.tx-actions{display:flex;align-items:center;gap:6px}
.btn-icon{background:none;color:var(--muted);padding:4px;height:auto;font-size:14px}
.expense{color:var(--red)}.payment{color:var(--orange)}

.chart-container{position:relative;margin:auto;height:240px;width:100%}

/* Bottom Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;height:calc(60px + env(safe-area-inset-bottom));background:white;border-top:1px solid var(--line);display:flex;justify-around:space-around;padding-bottom:env(safe-area-inset-bottom);z-index:100}
.nav-btn{background:none;border:0;color:var(--muted);font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;flex:1}
.nav-btn.active{color:var(--primary);font-weight:700}

/* FAB */
.fab{position:fixed;bottom:calc(70px + env(safe-area-inset-bottom));right:16px;width:52px;height:52px;border-radius:26px;background:var(--primary);color:white;font-size:24px;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 12px rgba(37,99,235,0.4);z-index:99}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.4);display:none;align-items:flex-end;z-index:200}
.modal.open{display:flex}
.modal-body{background:white;width:100%;border-radius:20px 20px 0 0;padding:20px;max-height:90vh;overflow-y:auto}
</style>
</head>
<body>

<header>
  <div>
    <h1>Kanakku</h1>
  </div>
  <div style="display:flex;gap:6px;align-items:center">
    <select id="monthFilter" style="height:36px;width:auto;font-size:13px"></select>
    <button class="danger" id="clearBtn">Reset</button>
  </div>
</header>

<div class="cards-scroll" id="summary"></div>

<div class="content">
  <!-- Tab 1: Dashboard & Transactions -->
  <div id="tab-tx" class="tab-content active">
    <div class="panel">
      <h2>Spending Breakdown</h2>
      <div class="chart-container">
        <canvas id="expenseChart"></canvas>
      </div>
    </div>

    <div class="panel">
      <h2>Recent Transactions</h2>
      <div id="transactions"></div>
    </div>
  </div>

  <!-- Tab 2: Budget -->
  <div id="tab-budget" class="tab-content">
    <div class="panel">
      <h2>Salary Allocations</h2>
      <label>Monthly Salary (₹)</label>
      <input type="number" id="salary" min="0" step="500" placeholder="e.g. 140000">
      <div id="budgetProgress" style="margin-top:16px"></div>
    </div>
  </div>

  <!-- Tab 3: Credit Card -->
  <div id="tab-card" class="tab-content">
    <div class="panel">
      <h2>Credit Card Summary</h2>
      <div id="ccSummary"></div>
      <label>Pay Bill</label>
      <div class="row">
        <input type="date" id="payDate">
        <input type="number" id="payAmount" min="1" placeholder="Amount">
      </div>
      <button style="width:100%;margin-top:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa" id="payBtn">Record Card Payment</button>
    </div>
  </div>
</div>

<button class="fab" id="openAddModal">+</button>

<!-- Add / Edit Modal -->
<div class="modal" id="addModal">
  <div class="modal-body">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <h2 style="margin:0;font-size:18px" id="modalTitle">Add Expense</h2>
      <button style="background:none;color:var(--muted);font-size:20px;height:auto;padding:0" id="closeAddModal">✕</button>
    </div>
    
    <input type="hidden" id="editId" value="">

    <div class="row">
      <div>
        <label>Date</label>
        <input type="date" id="date">
      </div>
      <div>
        <label>Amount (₹)</label>
        <input type="number" id="amount" min="1" step="1" placeholder="0">
      </div>
    </div>

    <div id="expenseFields">
      <label>Category</label>
      <select id="category"></select>
      <div class="quick" id="quick"></div>

      <label>Payment Method</label>
      <div class="type">
        <button type="button" id="cashBtn" class="active">Cash / UPI</button>
        <button type="button" id="ccBtn">Credit Card</button>
      </div>
      <input type="hidden" id="payment" value="Cash / UPI / Debit">
    </div>

    <label>Note (Optional)</label>
    <input id="note" placeholder="e.g. groceries, petrol">

    <button class="primary" style="width:100%;margin-top:16px" id="addBtn">Save Expense</button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-btn active" onclick="switchTab('tx', this)"><span>📊</span>Dashboard</button>
  <button class="nav-btn" onclick="switchTab('budget', this)"><span>🎯</span>Budget</button>
  <button class="nav-btn" onclick="switchTab('card', this)"><span>💳</span>Cards</button>
</nav>

<script>
const KEY='kanakku_v2_data';
const DEFAULT_CATS=['House Expenses','Vegetables & Fruits','Groceries','Savings','Transport','School Fees','Medical','Shopping','Food & Snacks','Other'];
const DEFAULT_ALLOC={'House Expenses':30,'Vegetables & Fruits':8,'Groceries':12,'Savings':20,'Transport':8,'School Fees':10,'Medical':5,'Shopping':2,'Food & Snacks':3,'Other':2};

const CHART_COLORS = ['#2563eb', '#16a34a', '#ea580c', '#dc2626', '#8b5cf6', '#06b6d4', '#ec4899', '#f59e0b', '#64748b', '#10b981'];

let data={salary:0,alloc:{...DEFAULT_ALLOC},tx:[]};
let selectedMonth='';
let pieChartInstance=null;

function money(n){return '₹'+Math.round(Math.abs(n)).toLocaleString('en-IN')}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}
function load(){
  try{
    const x=JSON.parse(localStorage.getItem(KEY));
    if(x && Array.isArray(x.tx)) data={...data,...x,alloc:{...DEFAULT_ALLOC,...(x.alloc||{})}};
  }catch(e){}
}
function today(){return new Date().toISOString().slice(0,10)}
function monthKey(date){return date.slice(0,7)}
function monthLabel(m){
  const [y,mo]=m.split('-');
  return new Date(Number(y),Number(mo)-1,1).toLocaleDateString('en-IN',{month:'short',year:'2-digit'});
}
function currentMonth(){return today().slice(0,7)}

function setup(){
  load();
  document.getElementById('date').value=today();
  document.getElementById('payDate').value=today();
  setupCategories();
  setupMonths();
  setupEvents();
  render();
}

function switchTab(tabId, btn){
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('tab-'+tabId).classList.add('active');
  btn.classList.add('active');
}

function setupCategories(){
  const s=document.getElementById('category');
  s.innerHTML=DEFAULT_CATS.map(c=>`<option>${c}</option>`).join('');
  const quick=['House Expenses','Groceries','Transport','Medical'];
  document.getElementById('quick').innerHTML=quick.map(c=>`<button type="button" data-cat="${c}">${c}</button>`).join('');
  document.querySelectorAll('#quick button').forEach(b=>b.onclick=()=>s.value=b.dataset.cat);
}

function setupMonths(){
  const months=new Set([currentMonth()]);
  data.tx.forEach(t=>months.add(monthKey(t.date)));
  const list=[...months].sort().reverse();
  if(!selectedMonth) selectedMonth=currentMonth();
  if(!list.includes(selectedMonth)) list.unshift(selectedMonth);
  const s=document.getElementById('monthFilter');
  s.innerHTML=list.map(m=>`<option value="${m}">${monthLabel(m)}</option>`).join('');
  s.value=selectedMonth;
}

function setupEvents(){
  document.getElementById('monthFilter').onchange=e=>{selectedMonth=e.target.value;render()};
  document.getElementById('salary').onchange=e=>{data.salary=Number(e.target.value)||0;save();render()};
  document.getElementById('addBtn').onclick=saveExpense;
  document.getElementById('payBtn').onclick=addCardPayment;
  document.getElementById('clearBtn').onclick=()=>{
    if(confirm('Delete all saved data?')){
      data={salary:0,alloc:{...DEFAULT_ALLOC},tx:[]};save();selectedMonth=currentMonth();setupMonths();render();
    }
  };
  document.getElementById('cashBtn').onclick=()=>setPayment('Cash / UPI / Debit');
  document.getElementById('ccBtn').onclick=()=>setPayment('Credit Card');
  
  const modal = document.getElementById('addModal');
  document.getElementById('openAddModal').onclick=()=>{
    resetForm();
    document.getElementById('modalTitle').innerText = 'Add Expense';
    modal.classList.add('open');
  };
  document.getElementById('closeAddModal').onclick=()=>modal.classList.remove('open');
}

function setPayment(v){
  document.getElementById('payment').value=v;
  document.getElementById('cashBtn').classList.toggle('active',v!=='Credit Card');
  document.getElementById('ccBtn').classList.toggle('active',v==='Credit Card');
}

function resetForm(){
  document.getElementById('editId').value='';
  document.getElementById('date').value=today();
  document.getElementById('amount').value='';
  document.getElementById('note').value='';
  document.getElementById('expenseFields').style.display='block';
  setPayment('Cash / UPI / Debit');
}

function saveExpense(){
  const editId = document.getElementById('editId').value;
  const date = document.getElementById('date').value;
  const amount = Number(document.getElementById('amount').value);
  const note = document.getElementById('note').value.trim();
  
  if(!date||amount<=0){alert('Please enter date and amount.');return}

  if(editId){
    const index = data.tx.findIndex(t => t.id == editId);
    if(index !== -1){
      const tx = data.tx[index];
      tx.date = date;
      tx.amount = amount;
      tx.note = note;
      if(tx.kind === 'expense'){
        tx.category = document.getElementById('category').value;
        tx.payment = document.getElementById('payment').value;
      }
    }
  } else {
    const category = document.getElementById('category').value;
    const payment = document.getElementById('payment').value;
    data.tx.push({id:Date.now(),kind:'expense',date,amount,category,payment,note});
  }

  save();
  selectedMonth=monthKey(date);setupMonths();render();
  resetForm();
  document.getElementById('addModal').classList.remove('open');
}

function editTx(id){
  const tx = data.tx.find(t => t.id === id);
  if(!tx) return;

  document.getElementById('editId').value = tx.id;
  document.getElementById('date').value = tx.date;
  document.getElementById('amount').value = tx.amount;
  document.getElementById('note').value = tx.note || '';

  if(tx.kind === 'expense'){
    document.getElementById('modalTitle').innerText = 'Edit Expense';
    document.getElementById('expenseFields').style.display = 'block';
    document.getElementById('category').value = tx.category;
    setPayment(tx.payment);
  } else {
    document.getElementById('modalTitle').innerText = 'Edit Card Payment';
    document.getElementById('expenseFields').style.display = 'none';
  }

  document.getElementById('addModal').classList.add('open');
}

function addCardPayment(){
  const date=document.getElementById('payDate').value;
  const amount=Number(document.getElementById('payAmount').value);
  if(!date||amount<=0){alert('Please enter payment date and amount.');return}
  data.tx.push({id:Date.now(),kind:'card_payment',date,amount,category:'Credit Card Bill',payment:'Bank / UPI',note:'Card bill payment'});
  save();
  selectedMonth=monthKey(date);setupMonths();render();
  document.getElementById('payAmount').value='';
}

function removeTx(id){
  if(confirm('Delete this transaction?')){
    data.tx=data.tx.filter(t=>t.id!==id);
    save();
    render();
  }
}

function selectedTx(){return data.tx.filter(t=>monthKey(t.date)===selectedMonth)}
function monthExpenses(){return selectedTx().filter(t=>t.kind==='expense')}

function render(){
  document.getElementById('salary').value=data.salary||'';
  renderSummary();
  renderChart();
  renderBudget();
  renderTransactions();
  renderCC();
}

function renderSummary(){
  const ex=monthExpenses();
  const spent=ex.reduce((s,t)=>s+t.amount,0);
  const cardSpend=ex.filter(t=>t.payment==='Credit Card').reduce((s,t)=>s+t.amount,0);
  const cashSpend=spent-cardSpend;
  const budget=data.salary;
  const remaining=Math.max(0,budget-spent);
  document.getElementById('summary').innerHTML=`
    <div class="card"><div class="label">Salary</div><div class="value blue">${money(budget)}</div></div>
    <div class="card"><div class="label">Total Spent</div><div class="value red">${money(spent)}</div></div>
    <div class="card"><div class="label">Card Spend</div><div class="value orange">${money(cardSpend)}</div></div>
    <div class="card"><div class="label">Cash / UPI</div><div class="value">${money(cashSpend)}</div></div>
    <div class="card"><div class="label">Remaining</div><div class="value green">${money(remaining)}</div></div>`;
}

function renderChart(){
  const ex=monthExpenses();
  const totals={};
  ex.forEach(t=>{totals[t.category]=(totals[t.category]||0)+t.amount});
  
  const labels=Object.keys(totals);
  const values=Object.values(totals);

  const ctx=document.getElementById('expenseChart').getContext('2d');
  
  if(pieChartInstance){
    pieChartInstance.destroy();
  }

  if(labels.length === 0){
    ctx.clearRect(0, 0, 300, 300);
    return;
  }

  pieChartInstance = new Chart(ctx, {
    type: 'pie',
    data: {
      labels: labels,
      datasets: [{
        data: values,
        backgroundColor: CHART_COLORS.slice(0, labels.length)
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: {
          position: 'bottom',
          labels: { boxWidth: 12, font: { size: 11 } }
        }
      }
    }
  });
}

function renderBudget(){
  const ex=monthExpenses();
  document.getElementById('budgetProgress').innerHTML=Object.entries(data.alloc).map(([cat,pct])=>{
    const budget=data.salary*pct/100;
    const spent=ex.filter(t=>t.category===cat).reduce((s,t)=>s+t.amount,0);
    const used=budget?spent/budget*100:0;
    return `<div class="budget-row">
      <div class="budget-head"><b>${cat}</b><span>${money(spent)} / ${money(budget)}</span></div>
      <div class="bar"><div class="fill ${used>100?'over':''}" style="width:${Math.min(100,used)}%"></div></div>
    </div>`;
  }).join('');
}

function renderTransactions(){
  const rows=[...selectedTx()].sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);
  const body=document.getElementById('transactions');
  if(!rows.length){body.innerHTML='<div style="text-align:center;padding:20px;color:var(--muted)">No transactions recorded.</div>';return}
  body.innerHTML=rows.map(t=>{
    const isPay=t.kind==='card_payment';
    return `<div class="tx-item">
      <div class="tx-info">
        <div class="tx-cat">${t.category}</div>
        <div class="tx-sub">${t.date} · ${t.payment} ${t.note?`· ${t.note}`:''}</div>
      </div>
      <div class="tx-actions">
        <div class="tx-amt ${isPay?'payment':'expense'}">${isPay?'−':'−'}${money(t.amount)}</div>
        <button class="btn-icon" onclick="editTx(${t.id})">✏️</button>
        <button class="btn-icon" onclick="removeTx(${t.id})">✕</button>
      </div>
    </div>`;
  }).join('');
}

function renderCC(){
  const purchases=data.tx.filter(t=>t.kind==='expense'&&t.payment==='Credit Card').reduce((s,t)=>s+t.amount,0);
  const payments=data.tx.filter(t=>t.kind==='card_payment').reduce((s,t)=>s+t.amount,0);
  const outstanding=Math.max(0,purchases-payments);
  document.getElementById('ccSummary').innerHTML=`
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Total Card Purchases</span><b>${money(purchases)}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Total Bill Payments</span><b>${money(payments)}</b></div>
    <div style="display:flex;justify-content:space-between;padding:6px 0"><span>Outstanding Due</span><b class="orange">${money(outstanding)}</b></div>`;
}

setup();
</script>
</body>
</html>
